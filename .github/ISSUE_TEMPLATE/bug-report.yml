name: Bug report
description: Report unexpected behavior in FreeZen.
labels: [bug]
body:
  - type: textarea
    id: actual-behavior
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: If you can reproduce the bug, list the steps and any setup needed.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the app version, device, operating system, or browser if known.
