name: Feature request
description: Propose a new feature or a change to how FreeZen works.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe what makes it difficult today.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: If you have a proposal, give an example of what you would do and what should happen.
